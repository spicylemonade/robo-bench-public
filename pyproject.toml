[project]
name = "roboticsbench"
version = "0.1.0"
description = "Physics-accurate humanoid + arm robotics benchmark (MuJoCo) for LLM agents and robot policies"
readme = "README.md"
requires-python = ">=3.11"
# pinned to the simulator stack of the official runs (Python 3.12, Linux, OSMesa rendering)
dependencies = [
    "mujoco==3.14.0",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "pillow==12.3.0",
    "imageio==2.37.4",
    "imageio-ffmpeg==0.6.0",
    "PyOpenGL==3.1.10",
    "scipy",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70", "openai>=1.60"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
rbench = "roboticsbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["roboticsbench"]
